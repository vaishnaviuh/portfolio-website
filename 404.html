<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — No signal · Vaishnavi Hiremath</title>
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .nf { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 24px var(--gutter); }
    .nf__scope {
      width: min(560px, 100%); aspect-ratio: 16 / 6; margin: 0 auto 32px;
      border: 1px solid var(--line-strong);
      background:
        linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 10% 25%,
        linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 10% 25%,
        var(--bg-2);
      position: relative; overflow: hidden;
    }
    .nf__scope svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .nf__trace { fill: none; stroke: var(--copper); stroke-width: 2; stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3s linear infinite; filter: drop-shadow(0 0 6px var(--copper)); }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .nf__meta { position: absolute; left: 12px; top: 10px; color: var(--muted); }
    .nf__meta--r { left: auto; right: 12px; }
    .nf h1 { font-size: clamp(56px, 13vw, 180px); white-space: nowrap; font-weight: 800; letter-spacing: -0.06em; line-height: .85; font-variation-settings: "wdth" 112; }
    .nf p.lead { font-size: clamp(20px, 2.4vw, 30px); margin: 20px 0 36px; letter-spacing: -0.01em; }
    .nf .serif { color: var(--copper); }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <div class="nf__scope" aria-hidden="true">
        <span class="mono nf__meta">CH1 · 500 mV/div</span>
        <span class="mono nf__meta nf__meta--r">TRIG: none</span>
        <svg viewBox="0 0 640 280" preserveAspectRatio="none">
          <path class="nf__trace" d="M0 140 H180 C200 140 204 60 222 60 C240 60 244 140 262 140 H300 l6 -4 l6 8 l6 -6 l6 2 H640" />
        </svg>
      </div>
      <p class="mono muted">Error 404</p>
      <h1>No signal<span class="copper">.</span></h1>
      <p class="lead">The page you probed is <em class="serif">floating</em>. Check the connection and try again.</p>
      <a href="./" class="btn btn--solid"><span>Back to the bench</span></a>
    </div>
  </main>
</body>
</html>
